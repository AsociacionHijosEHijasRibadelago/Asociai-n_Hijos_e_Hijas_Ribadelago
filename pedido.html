<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Realizar pedido - Asociación Hijos e Hijas de Ribadelago</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f6f1;
            color: #172b45;
        }

        header {
            text-align: center;
            padding: 25px;
            border-bottom: 1px solid #e5e5e5;
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .volver {
            color: #172b45;
            text-decoration: none;
            font-size: 20px;
        }

        .contenido {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .formulario {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 15px;
            padding: 30px;
        }

        .formulario h2 {
            margin-bottom: 25px;
            font-size: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, Helvetica, sans-serif;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .resumen {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #ddd;
        }

        .resumen h2 {
            margin-bottom: 20px;
        }

        #pedido {
            margin-bottom: 20px;
        }

        .producto-pedido {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .boton-enviar {
            display: block;
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            background: #172b45;
            color: white;
            text-align: center;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .boton-enviar:hover {
            opacity: 0.9;
        }

        .opcion-pago {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.opcion-pago input {
    width: auto;
    margin: 0;
}
        
    </style>
</head>

    <script>
if (performance.getEntriesByType("navigation")[0]?.type === "reload") {
    window.location.href = "index.html";
}
</script>
    
<body>

    <header>
        <h1>🛍️ Realizar pedido</h1>

        <a href="carrito.html" class="volver">
            ← Volver al carrito
        </a>
    </header>

    <main class="contenido">

        <div class="formulario">

            <h2>Datos del pedido</h2>

            <label for="nombre">Nombre y apellidos</label>
            <input type="text" id="nombre" required>

            <label for="telefono">Número de teléfono</label>
            <input type="tel" id="telefono" required>

            <label for="observaciones">Observaciones</label>
            <textarea id="observaciones"
                placeholder="Si quieres añadir algún comentario, escríbelo aquí..."></textarea>
            
    <div class="pago">

    <h2>Forma de pago</h2>

    <p class="pregunta-pago">¿Cómo quieres pagar tu pedido?</p>

    <label class="opcion-pago">
        <input type="radio" name="pago" value="Efectivo">
        💶 Efectivo
    </label>

    <label class="opcion-pago">
        <input type="radio" name="pago" value="Bizum">
        📱 Bizum
    </label>

    <div class="aviso-pago">
        ℹ️ El pago se realizará en el momento de la entrega del pedido.
        No se realizará ningún cobro online al efectuar el pedido.
    </div>

</div>
            <div class="resumen">

                <h2>Resumen del pedido</h2>

                <div id="pedido"></div>

                <div id="total" class="total"></div>

            </div>

            <button id="botonEnviar" class="boton-enviar" onclick="enviarPedido()">
                ENVIAR PEDIDO
            </button>

        </div>

    </main>

    <script>

        function mostrarPedido() {

            const carrito =
                JSON.parse(localStorage.getItem("carrito")) || [];

            const contenedor =
                document.getElementById("pedido");

            const totalElemento =
                document.getElementById("total");

            contenedor.innerHTML = "";

            let total = 0;

            carrito.forEach(producto => {

            const precio = Number(producto.precio) || 15;
            const subtotal = precio * producto.cantidad;

            total += subtotal;

                contenedor.innerHTML += `
                    <div class="producto-pedido">
                        <strong>${producto.producto}</strong><br>
                        Talla: ${producto.talla}<br>
                        Cantidad: ${producto.cantidad}<br>
                        Precio: ${subtotal.toFixed(2)} €
                    </div>
                `;

            });

            totalElemento.innerHTML =
                `Total: ${total.toFixed(2)} €`;
        }


        function enviarPedido() {
            
    const boton = document.getElementById("botonEnviar");

        boton.disabled = true;
        boton.textContent = "ENVIANDO PEDIDO...";
            
    const nombre =
        document.getElementById("nombre").value.trim();

    const telefono =
        document.getElementById("telefono").value.trim();

    const observaciones =
        document.getElementById("observaciones").value.trim();

    const pago =
    document.querySelector('input[name="pago"]:checked');
            
    if (!pago) {
    alert("Por favor, selecciona una forma de pago.");
    boton.disabled = false;
    boton.textContent = "ENVIAR PEDIDO";
    return;
}
    if (!nombre || !telefono) {
        alert("Por favor, completa tu nombre y número de teléfono.");
        boton.disabled = false;
        boton.textContent = "ENVIAR PEDIDO";
        return;
    }

    // Recuperar el carrito
    const carrito =
        JSON.parse(localStorage.getItem("carrito")) || [];

    if (carrito.length === 0) {
        alert("El carrito está vacío.");
        return;
    }

    // Calcular el total
    let total = 0;

    carrito.forEach(producto => {

        const precio = Number(producto.precio) || 15;

        total += precio * producto.cantidad;

    });

    // Crear el listado de artículos
    const articulos = carrito.map(producto => {

        return `${producto.producto} - Talla ${producto.talla} x${producto.cantidad}`;

    }).join(" | ");

    // Datos que enviaremos a Google Sheets
    const datos = {

        nombre: nombre,

        telefono: telefono,

        articulos: articulos,

        total: total,

        observaciones: observaciones,

        pago: pago.value,

        ubicacion: localStorage.getItem("ubicacionPedido") || "Web"

    };

    // URL de nuestro Google Apps Script
    const url =
        "https://script.google.com/macros/s/AKfycbzkl_j2rFFEwcZQvyjzZQdmfmnT6vP-Kv_H-l_8nmVyeYhMDjisoSwOiAth54XNljcv/exec";

    fetch(url, {

        method: "POST",

        body: JSON.stringify(datos)

    })

    .then(() => {

        boton.disabled = true;
        boton.textContent = "PEDIDO REALIZADO ✓";
        
        alert("¡Gracias por tu pedido! ❤️\n\nLa Asociación Hijos e Hijas de Ribadelago agradece enormemente tu colaboración y apoyo.");

        // Vaciar el carrito
        localStorage.removeItem("carrito");

        // Volver al inicio
        window.location.href = "index.html";

    })

    .catch(error => {

        console.error(error);

        alert("Ha ocurrido un error al enviar el pedido.");

    });

}

        mostrarPedido();

    </script>

</body>

</html>
