<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camiseta del Recuerdo - Asociación Hijos e Hijas de Ribadelago</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f8f6f1;
    color: #172b45;
}

.pagina {
    min-height: 100vh;
    padding: 45px 25px;
    text-align: center;
}

.titulo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 400;
    margin-bottom: 35px;
}

.producto {
    max-width: 850px;
    margin: 0 auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

.imagen-producto img {
    width: 100%;
    max-width: 650px;
    height: auto;
    display: block;
    margin: 0 auto 30px;
}

.nombre {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    font-weight: 400;
    margin-bottom: 10px;
}

.precio {
    font-size: 22px;
    margin-bottom: 30px;
}

.opciones {
    max-width: 450px;
    margin: 0 auto;
    text-align: left;
}

.opciones label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
}

.opciones select,
.opciones input {
    width: 100%;
    padding: 12px;
    margin-bottom: 22px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
    background: white;
}

.boton {
    display: inline-block;
    background: #172b45;
    color: white;
    padding: 14px 35px;
    border-radius: 6px;
    text-decoration: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
}

.boton:hover {
    opacity: 0.9;
}

.volver {
    display: inline-block;
    margin-top: 30px;
    color: #172b45;
    text-decoration: none;
    font-size: 15px;
}

</style>
</head>

<body>

<main class="pagina">

    <h1 class="titulo">
        NUESTROS PRODUCTOS
    </h1>

    <div class="producto">

        <div class="imagen-producto">
            <img src="0da05662-7793-425c-8855-b523945c8d8b.jpeg"
                 alt="Camiseta del Recuerdo">
        </div>

        <h2 class="nombre">
            Camiseta del Recuerdo
        </h2>

        <p class="precio">
            Precio próximamente
        </p>

        <div class="opciones">

            <label for="talla">Talla</label>

            <select id="talla">
                <option value="">Selecciona una talla</option>
                <option value="9-11">9–11 años</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
            </select>

            <label for="cantidad">Cantidad</label>

            <input
                type="number"
                id="cantidad"
                min="1"
                value="1"
            >

        </div>

        <button class="boton">
            CONTINUAR
        </button>

    </div>

    <a href="productos.html" class="volver">
        ← Volver a productos
    </a>

</main>

</body>
</html>
