<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos - Asociación Hijos e Hijas de Ribadelago</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f6f1;
            color: #172b45;
        }

        .pagina {
            min-height: 100vh;
            padding: 50px 25px;
            text-align: center;
        }

        .titulo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 45px;
        }

        .producto {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .imagen-camiseta img {
            width: 100%;
            max-width: 450px;
            height: auto;
            display: block;
            margin: 0 auto 25px;
            border-radius: 8px;
        }

        .nombre {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            font-weight: 400;
            margin-bottom: 12px;
        }

        .precio {
            font-size: 20px;
            margin-bottom: 25px;
            color: #555;
        }

        .boton {
            display: inline-block;
            background: #172b45;
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 6px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .boton:hover {
            opacity: 0.9;
        }

        .volver {
            display: inline-block;
            margin-top: 35px;
            color: #172b45;
            text-decoration: none;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <main class="pagina">

        <h1 class="titulo">
            NUESTROS PRODUCTOS
        </h1>

        <div class="producto">

            <div class="imagen-camiseta">
                <img src="0da05662-7793-425c-8855-b523945c0d8b.jpeg" alt="Camiseta del recuerdo">
            </div>

            <h2 class="nombre">
                Camiseta del recuerdo
            </h2>

            <p class="precio">
                Precio próximamente
            </p>

            <a href="camiseta.html" class="boton">
    VER PRODUCTO
</a>

        </div>

        <a href="index.html" class="volver">
            ← Volver al inicio
        </a>

    </main>

</body>

</html>
